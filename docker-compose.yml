version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: vtpl/attendance-backend:latest
    container_name: attendance-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend.env

  frontend:
    build:
      context: ./frontend
    image: vtpl/attendance-frontend:latest
    container_name: attendance-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend.env
    depends_on:
      - backend
